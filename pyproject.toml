[project]
name = "javacard-webauthn-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",  # https://github.com/LudovicRousseau/pyscard
    "fido2>=2.2.1",
    "pyscard>=2.3.1",
]

[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
executionEnvironments = [{ root = "src/fido2" }]

[tool.ruff.lint.isort]
known-first-party = ["ctap_trace", "demo"]
